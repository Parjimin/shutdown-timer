name: Materialize corrected app icon

on:
  push:
    branches: [main]
    paths:
      - "Assets/logo_base64/**"
      - ".github/workflows/materialize-logo.yml"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  materialize:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Reconstruct PNG source
        shell: bash
        run: |
          cat Assets/logo_base64/chunk_*.b64 | base64 --decode > Assets/app-logo.png
          test -s Assets/app-logo.png
          file Assets/app-logo.png

      - name: Generate proper multi-size Windows ICO
        shell: bash
        run: |
          python -m pip install --quiet pillow
          python - <<'PY'
          from PIL import Image
          from pathlib import Path

          png = Path("Assets/app-logo.png")
          ico = Path("Assets/ShutdownTimer.ico")

          image = Image.open(png).convert("RGBA")
          if image.size != (256, 256):
              image = image.resize((256, 256), Image.Resampling.LANCZOS)
              image.save(png, optimize=True)

          image.save(
              ico,
              format="ICO",
              sizes=[
                  (16,16),(20,20),(24,24),(32,32),
                  (40,40),(48,48),(64,64),(128,128),(256,256)
              ]
          )

          print("PNG:", png.stat().st_size, image.size)
          print("ICO:", ico.stat().st_size)
          PY

      - name: Commit corrected assets and clean transport files
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -f Assets/app-logo.png Assets/ShutdownTimer.ico
          git rm -r Assets/logo_base64
          git rm .github/workflows/materialize-logo.yml
          git commit -m "Replace app logo assets with corrected versions [skip ci]"
          git push
